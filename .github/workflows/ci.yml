name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-tool-api:ci
          load: true

      - name: Smoke-test the container
        run: |
          docker run -d -p 8000:8000 --name rag-tool-api-ci rag-tool-api:ci
          # Give the container a moment to become healthy
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              break
            fi
            echo "Waiting for container to be ready... ($i/10)"
            sleep 2
          done
          curl -sf http://localhost:8000/health || (docker logs rag-tool-api-ci && exit 1)
          docker stop rag-tool-api-ci
