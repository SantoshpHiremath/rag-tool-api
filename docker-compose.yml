services:
  rag-tool-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AGENT_MODE=stub
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
